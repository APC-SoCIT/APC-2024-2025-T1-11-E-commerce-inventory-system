{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Sportswear - Jersey Customizer</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="{% static 'images/new_logo1.png' %}" alt="Logo" class="logo-img">
            </div>
            <ul class="nav-links">
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Help & Contact</a></li>
                <li><a href="#">About us</a></li>
                <li><a href="#">Reviews</a></li>
            </ul>
            <div class="icons">
                <!-- Language, Sign In, and Cart dropdowns here -->
            </div>
        </nav>
    </header>

    <section class="customizer">
        <div class="customizer-container">
            <div id="canvas-container"></div>
            <div class="controls">
                <h2>Customize Your Jersey</h2>
                <select id="jerseyType">
                    <option value="tshirt">T-Shirt</option>
                    <option value="sleeveless">Sleeveless</option>
                </select>
                <input type="color" id="jerseyColor" value="#ffffff">
                <input type="text" id="playerName" placeholder="Player Name">
                <input type="number" id="playerNumber" placeholder="Player Number" min="0" max="99">
                <button id="downloadBtn">Download Design</button>
            </div>
        </div>
    </section>

    <script src="{% static 'js/jersey_customizer.js' %}"></script>
</body>
</html>

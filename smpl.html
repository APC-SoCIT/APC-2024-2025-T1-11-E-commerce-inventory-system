<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Header</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding-top: 100px; /* Prevents content from hiding under the header */
            background: #f4f4f4;
        }

        /* Sticky Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #333;
            color: white;
            padding: 60px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 15px;
        }

        .header-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
        }

        .header-logo {
            height: 60px; /* Adjust to match text height */
        }

        /* Navigation Menu */
        nav {
            width: 100%;
            display: flex;
            justify-content: center;
            position: absolute;
            bottom: 0;
            left: 0;
            padding-bottom: 10px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            padding: 8px 15px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            background: #555;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <img src="logo.png" alt="Logo" class="header-logo">
            <div class="header-title">WorksTeamWear</div>
        </div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#cart">Cart</a></li>
                <li><a href="#shipping">Shipping</a></li>
                <li><a href="#settings">Settings</a></li>
                <li><a href="#contact">Contact Us</a></li>
            </ul>
        </nav>
    </header>

</body>
</html>
